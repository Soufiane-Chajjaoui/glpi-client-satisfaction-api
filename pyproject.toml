[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "glpi-light"
version = "1.0.0"
description = "GLPI Light Analytics Pipeline + REST API"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pymysql>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "apscheduler>=3.10",
    "onnxruntime>=1.20",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = [
    "transformers>=4.30",
    "torch>=2.0",
]

[project.scripts]
pipeline = "pipeline:main"
scheduler = "scheduler:main"

[tool.setuptools.packages.find]
include = ["api*", "lib*", "apps*", "setup*"]
